- name: Synchronize TMM workflows into Automation Orchestrator
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ao_api_url: "http://automation-orchestrator-backend.automation-orchestrator.svc.cluster.local:8000/api/v1"
    ao_api_host: ""
    # The AAP project checkout is the source of truth.  Keeping the source
    # local makes this playbook usable from an AAP project without network
    # access back to GitHub.
    ao_workflow_root: "{{ playbook_dir }}/.."
    ao_demo_project_id: ""
    ao_aap_credential_id: ""
    ao_aap_integration_id: ""
    ao_agent_credential_id: ""
  pre_tasks:
    - name: Validate required AO variables
      ansible.builtin.assert:
        that:
          - ao_api_token | length > 0
          - ao_api_host | length > 0
          - ao_aap_credential_id | length > 0
          - ao_aap_integration_id | length > 0
        fail_msg: >-
          ao_api_token, ao_api_host, ao_aap_credential_id, and
          ao_aap_integration_id are required. Pass them as AAP extra variables
          or through a credential.
      no_log: true

    - name: Find the AO project for imported workflows
      ansible.builtin.uri:
        url: "{{ ao_api_url }}/projects?limit=100"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_api_token }}"
          Host: "{{ ao_api_host }}"
        validate_certs: false
        use_proxy: false
        return_content: true
      register: __ao_projects
      no_log: true
      failed_when: false
      until: __ao_projects.status | default(0) == 200
      retries: 30
      delay: 5

    - name: Validate AO project lookup
      ansible.builtin.assert:
        that:
          - __ao_projects.status | default(0) == 200
        fail_msg: >-
          AO project lookup failed from AAP (status={{ __ao_projects.status | default('unreachable') }};
          error={{ __ao_projects.msg | default('unknown error') }}).

    - name: Select the target AO project
      ansible.builtin.set_fact:
        ao_demo_project_id: >-
          {{ ao_demo_project_id
             or ((__ao_projects.json.resources | default(__ao_projects.json.results | default([])))
                 | selectattr('is_default', 'equalto', true)
                 | map(attribute='id') | first | default('')) }}

    - name: Require a target AO project
      ansible.builtin.assert:
        that:
          - ao_demo_project_id | length > 0
        fail_msg: "AO has no default project and ao_demo_project_id was not provided."

    - name: Locate AO workflow exports in the AAP project checkout
      ansible.builtin.find:
        paths: "{{ ao_workflow_root }}"
        patterns: "*.json"
        recurse: true
        file_type: file
      register: __ao_workflow_files

    - name: Keep only AO workflow exports
      ansible.builtin.set_fact:
        __ao_sources: >-
          {{ __ao_workflow_files.files
             | selectattr('path', 'search', '/ao/[^/]+\\.json$')
             | sort(attribute='path')
             | list }}

    - name: Ensure upstream exports were found
      ansible.builtin.assert:
        that:
          - __ao_sources | length > 0
        fail_msg: "No AO workflow JSON files were found under {{ ao_workflow_root }}."

  tasks:
    - name: Synchronize each AO workflow export
      ansible.builtin.include_tasks: tasks/sync_workflow.yml
      loop: "{{ __ao_sources }}"
      loop_control:
        loop_var: __ao_source
        label: "{{ __ao_source.path | basename }}"
